name: GitHub Actions Security Analysis with zizmor

on:
    push:
        branches: [10.x]
    pull_request:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions: {}

jobs:
    zizmor:
        name: Run zizmor
        runs-on: ubuntu-latest
        permissions:
            security-events: write # upload SARIF results to the Security tab
            contents: read # checkout the workflow files to audit
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Run zizmor
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
              with:
                  # https://github.com/zizmorcore/zizmor/releases - bump this when a new zizmor version ships
                  version: 1.30.1
                  # Fork PRs get a read-only token and can't upload SARIF to the Security tab;
                  # fall back to console annotations there instead.
                  advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
                  annotations: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
