name: Pint

on: [push]

permissions:
    contents: read

jobs:
    php-code-styling:
        runs-on: ubuntu-latest
        permissions:
            contents: write # needed to push the auto-commit with style fixes

        steps:
            - name: Checkout code # zizmor: ignore[artipacked] persisted credentials are required for the commit step below to push
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Fix PHP code style issues
              uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6
              with:
                  pintVersion: ^1.25.1

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
              with:
                  commit_message: Fix styling
