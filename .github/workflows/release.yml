name: Create Release

on:
    push:
        branches:
            - 10.x
        paths-ignore:
            - 'docs-v3/**'
            - 'docs-v2/**'
            - '*.md'
            - '.gitignore'

# No default permissions: each job below declares exactly what it needs.
permissions: {}

# Queue release runs so each computes the next tag after the previous one exists.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # Everything that executes third-party code (Composer plugins and scripts, the test
    # suite and its dependencies) runs here, with a token that can only read. Nothing from
    # this job is handed to the release job: no outputs, no artifacts, no caches.
    test:
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/10.x'
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }} # the pushed commit, never the moving branch head
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify the checked out commit is the pushed commit
              run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

            - name: Skip commits that are already released
              id: released
              run: |
                  RELEASED_IN=$(git tag --contains HEAD --sort=v:refname | head -n1)
                  if [ -n "$RELEASED_IN" ]; then
                      echo "HEAD is already in $RELEASED_IN."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Setup PHP
              if: steps.released.outputs.skip != 'true'
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: 8.4
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                  coverage: none

            -   name: Install dependencies
                if: steps.released.outputs.skip != 'true'
                run: |
                    composer require "laravel/framework:12.*" "orchestra/testbench:10.*" --no-interaction --no-update
                    composer update --prefer-stable --prefer-dist --no-interaction

            - name: Execute tests
              if: steps.released.outputs.skip != 'true'
              run: composer test

    # The only job with a write token. It starts on a fresh runner from a fresh checkout of
    # the commit the test job tested (github.sha comes from the push event, not from the
    # test job) and runs nothing but git and gh: no Composer or npm install, no PHP, no
    # scripts from the repository or its dependencies. Keep it that way.
    release:
        needs: test
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/10.x'
        permissions:
            contents: write # needed to create the GitHub release and tag

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }} # the commit the test job tested
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify the checked out commit is the tested commit
              run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

            - name: Skip commits that are already released
              id: released
              run: |
                  RELEASED_IN=$(git tag --contains HEAD --sort=v:refname | head -n1)
                  if [ -n "$RELEASED_IN" ]; then
                      echo "HEAD is already in $RELEASED_IN."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Get next version
              if: steps.released.outputs.skip != 'true'
              id: get_version
              run: |
                  # Get all tags and sort by version number (descending)
                  LATEST_TAG=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1nr -k2,2nr -k3,3nr | head -n1)

                  # If no tags found, default to 0.0.0
                  if [ -z "$LATEST_TAG" ]; then
                      LATEST_TAG="0.0.0"
                  fi

                  echo "Latest tag: $LATEST_TAG"

                  # Split version into parts
                  IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

                  # Default to 0 if parts are empty
                  MAJOR=${MAJOR:-0}
                  MINOR=${MINOR:-0}
                  PATCH=${PATCH:-0}

                  # Increment patch version for every merge, or the minor one when the commit
                  # subject carries [release:minor]. A revert of such a commit stays a patch.
                  SUBJECT=$(git log -1 --format=%s "$GITHUB_SHA")
                  if [[ "$SUBJECT" == *'[release:minor]'* && "$SUBJECT" != Revert* ]]; then
                      MINOR=$((MINOR + 1))
                      PATCH=0
                  else
                      PATCH=$((PATCH + 1))
                  fi

                  # Create new version
                  NEW_VERSION="$MAJOR.$MINOR.$PATCH"

                  echo "New version: $NEW_VERSION"
                  echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
                  echo "tag_name=$NEW_VERSION" >> $GITHUB_OUTPUT

            - name: Generate changelog
              if: steps.released.outputs.skip != 'true'
              id: changelog
              run: |
                  # Get the previous tag for changelog
                  PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

                  if [ -z "$PREVIOUS_TAG" ]; then
                    # If no previous tags, get all commits
                    COMMITS=$(git log --pretty=format:"* %s (%an)" --no-merges)
                  else
                    # Get commits since last tag
                    COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"* %s (%an)" --no-merges)
                  fi

                  # Create changelog
                  CHANGELOG="## What's Changed\n\n$COMMITS"

                  # Handle multiline output for GitHub Actions
                  echo "changelog<<EOF" >> $GITHUB_OUTPUT
                  echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create Release
              if: steps.released.outputs.skip != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ steps.get_version.outputs.tag_name }}
                  RELEASE_NAME: Release ${{ steps.get_version.outputs.tag_name }}
                  RELEASE_BODY: ${{ steps.changelog.outputs.changelog }}
              run: |
                  gh release create "$TAG_NAME" \
                      --target "$GITHUB_SHA" \
                      --title "$RELEASE_NAME" \
                      --notes "$RELEASE_BODY"
