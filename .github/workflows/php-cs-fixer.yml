name: Fix PHP code style issues

on: [push]

permissions:
    contents: read

jobs:
    php-code-styling:
        runs-on: ubuntu-latest
        permissions:
            contents: write # needed to push the auto-commit with style fixes

        steps:
            - name: Checkout code # zizmor: ignore[artipacked] persisted credentials are required for the commit step below to push
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ github.head_ref }}

            - name: Fix PHP code style issues
              uses: aglipanci/laravel-pint-action@8eedec46a1856977c41667f9c66d5562fa3f9c08 # v2.4

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              with:
                  commit_message: Fix styling
